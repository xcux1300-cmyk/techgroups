<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DIVULGAR GRUPO - TELEGROUPS</title>
    <style>
        :root {
            --bg-principal: #04060a;
            --bg-card: #0a0f1d;
            --verde-neon: #00ff87;
            --texto-p: #798a9e;
            --texto-h: #ffffff;
            --borda: #141f36;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: '-apple-system', BlinkMacSystemFont, sans-serif; }
        body { background: var(--bg-principal); color: var(--texto-h); padding: 30px 15px; }
        
        .form-container { max-width: 450px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--borda); padding: 25px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        h2 { font-size: 20px; font-weight: 900; margin-bottom: 20px; color: #fff; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
        h2 span { color: var(--verde-neon); }

        .grupo-input { margin-bottom: 18px; }
        label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--texto-p); margin-bottom: 8px; letter-spacing: 1px; }
        
        input, select, textarea {
            width: 100%; background: #04060a; border: 1px solid var(--borda); padding: 12px; border-radius: 8px;
            color: #fff; font-size: 14px; transition: border 0.2s; outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--verde-neon); }

        textarea { resize: none; height: 80px; }

        .btn-salvar {
            width: 100%; background: transparent; color: var(--verde-neon); border: 1px solid var(--verde-neon);
            padding: 14px; border-radius: 8px; font-weight: 800; font-size: 13px; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; transition: all 0.2s; margin-top: 10px;
        }
        .btn-salvar:hover { background: rgba(0, 255, 135, 0.05); }
        .btn-salvar:disabled { border-color: var(--borda); color: var(--texto-p); cursor: not-allowed; }

        .btn-voltar { display: block; text-align: center; margin-top: 20px; color: var(--texto-p); text-decoration: none; font-size: 12px; font-weight: 700; }
        .btn-voltar:hover { color: #fff; }

        .msg-status { padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 700; text-align: center; margin-top: 15px; display: none; }
        .msg-sucesso { background: rgba(0, 255, 135, 0.1); color: var(--verde-neon); border: 1px solid var(--verde-neon); }
        .msg-erro { background: rgba(255, 51, 68, 0.1); color: #ff3344; border: 1px solid #ff3344; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2><span>+</span> DIVULGAR NOVO LINK</h2>
        
        <form id="form-grupo" onsubmit="enviarGrupo(event)">
            <div class="grupo-input">
                <label>Nome do Grupo / Canal</label>
                <input type="text" id="nome" placeholder="Ex: Devs do Futuro" required>
            </div>

            <div class="grupo-input">
                <label>Categoria</label>
                <select id="categoria" required>
                    <option value="Programação">🖥️ Programação</option>
                    <option value="Marketing">📈 Marketing</option>
                    <option value="Design">🎨 Design</option>
                    <option value="Negócios">💼 Negócios</option>
                    <option value="Amizades">💬 Amizades</option>
                    <option value="Apostas">🎲 Apostas</option>
                    <option value="+18">🔞 +18</option>
                </select>
            </div>

            <div class="grupo-input">
                <label>Link de Convite (Telegram)</label>
                <input type="url" id="link" placeholder="https://t.me/seu_link" required>
            </div>

            <div class="grupo-input">
                <label>Breve Descrição</label>
                <textarea id="descricao" maxlength="120" placeholder="Conte o que tem no seu grupo (Máx 120 caracteres)..." required></textarea>
            </div>

            <button type="submit" id="btn-submit" class="btn-salvar">ENVIAR PARA ANÁLISE</button>
        </form>

        <div id="status-msg" class="msg-status"></div>

        <a href="index.html" class="btn-voltar">← Voltar para a Vitrine</a>
    </div>

    <script>
        const SUPABASE_URL = "https://fufgsmmejwvibqkglkbv.supabase.co";
        const SUPABASE_KEY = "sb_publishable_KUq3cj4qjnjXdv2FEDQ5Xw_z9to0B5P";

        async function enviarGrupo(e) {
            e.preventDefault();
            
            const btnSubmit = document.getElementById('btn-submit');
            const statusMsg = document.getElementById('status-msg');
            
            const nome = document.getElementById('nome').value.trim();
            const categoria = document.getElementById('categoria').value;
            const link = document.getElementById('link').value.trim();
            const descricao = document.getElementById('descricao').value.trim();

            // Proteção 1: Validação básica contra Link Falso
            if(!link.includes('t.me') && !link.includes('telegram.me')) {
                statusMsg.className = "msg-status msg-erro";
                statusMsg.innerText = "Por favor, insira um link válido do Telegram (t.me/...).";
                statusMsg.style.display = "block";
                return;
            }

            // Proteção 2: Desativar botão para evitar cliques múltiplos (Spam)
            btnSubmit.disabled = true;
            btnSubmit.innerText = "ENVIANDO PROTOCOLO...";
            statusMsg.style.display = "none";

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/lista_grupos`, {
                    method: 'POST',
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": "Bearer " + SUPABASE_KEY,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify({
                        nome: nome,
                        categoria: categoria,
                        link: link,
                        descricao: descricao,
                        aprovado: false, // Entra como falso para você moderar no banco
                        likes: 0,
                        cliques: 0
                    })
                });

                if(response.ok) {
                    statusMsg.className = "msg-status msg-sucesso";
                    statusMsg.innerText = "Sucesso! Seu link foi enviado e será verificado.";
                    statusMsg.style.display = "block";
                    document.getElementById('form-grupo').reset();
                } else {
                    throw new Error();
                }
            } catch (error) {
                statusMsg.className = "msg-status msg-erro";
                statusMsg.innerText = "Erro ao processar envio. Tente novamente.";
                statusMsg.style.display = "block";
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "ENVIAR PARA ANÁLISE";
            }
        }
    </script>
</body></html>
