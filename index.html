<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- TAGS DE INFORMAÇÃO PARA O GOOGLE ENCONTRAR O SITE (SEO) -->
    <title>TELEGROUPS - Diretório Premium de Grupos do Telegram</title>
    <meta name="description" content="Encontre os melhores grupos e canais do Telegram sobre Programação, Marketing, Design e Negócios. Links verificados diariamente.">
    <meta name="keywords" content="grupos telegram, canais telegram, links telegram, marketing, programacao, listas telegram">
    <meta name="robots" content="index, follow">

    <style>
        :root {
            --bg-principal: #070a13;
            --bg-card: #0f1626;
            --verde-neon: #00ff87;
            --verde-escuro: #00b35d;
            --texto-p: #94a3b8;
            --texto-h: #ffffff;
            --borda: #1e293b;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-principal); 
            color: var(--texto-h); 
            padding: 15px;
            padding-bottom: 40px;
        }

        .container { max-width: 600px; margin: 0 auto; }

        /* Header Totalmente Mobile First */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 0; 
            border-bottom: 1px solid var(--borda); 
            margin-bottom: 20px; 
        }
        
        .logo { 
            font-size: 22px; 
            font-weight: 900; 
            color: var(--texto-h); 
            letter-spacing: -0.5px; 
        }
        .logo span { color: var(--verde-neon); }

        .btn-enviar { 
            background: var(--verde-neon); 
            color: var(--bg-principal);
            padding: 8px 16px; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: 800; 
            font-size: 13px;
            text-transform: uppercase;
            box-shadow: 0 0 12px rgba(0,255,135,0.3);
        }
        
        /* Barra de Categorias Deslizante no Celular */
        .categorias-nav { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 20px; 
            overflow-x: auto; 
            padding-bottom: 8px;
            scrollbar-width: none; /* Esconde barra no Firefox */
        }
        .categorias-nav::-webkit-scrollbar { display: none; } /* Esconde barra no Chrome/Safari */
        
        .cat-btn { 
            background: var(--bg-card); 
            border: 1px solid var(--borda); 
            color: var(--texto-p); 
            padding: 8px 16px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap; /* Impede o texto de quebrar linha */
        }
        .cat-btn.active { background: var(--verde-neon); color: var(--bg-principal); border-color: var(--verde-neon); font-weight: 700; }

        /* Lista de Cards Estilo Aplicativo */
        .grid-grupos { display: flex; flex-direction: column; gap: 12px; }
        
        .card { 
            background: var(--bg-card); 
            border: 1px solid var(--borda); 
            padding: 16px; 
            border-radius: 12px; 
        }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .card h3 { font-size: 18px; font-weight: 700; color: var(--texto-h); max-width: 75%; }
        
        .badge { 
            background: rgba(0, 255, 135, 0.1);
            color: var(--verde-neon); 
            font-size: 11px; 
            padding: 4px 8px; 
            border-radius: 6px; 
            font-weight: 700;
            text-transform: uppercase;
        }
        
        .card p { color: var(--texto-p); font-size: 13px; line-height: 1.4; margin-bottom: 16px; }
        
        /* Rodapé do Card Otimizado para Dedão */
        .card-footer { display: flex; justify-content: space-between; align-items: center; }
        
        .btn-entrar { 
            background: #0088cc; /* Azul clássico do Telegram */
            color: white; 
            padding: 10px 24px; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        
        .like-zone { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.04); padding: 8px 12px; border-radius: 8px; }
        .btn-like { background: none; border: none; cursor: pointer; font-size: 16px; }
        .like-count { color: var(--texto-h); font-weight: 700; font-size: 13px; }

        .loading { text-align: center; color: var(--texto-p); padding: 40px; font-size: 15px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">TELEGROUPS<span>//</span></div>
            <a href="enviar.html" class="btn-enviar">+ Adicionar</a>
        </div>

        <div class="categorias-nav">
            <button class="cat-btn active" onclick="filtrar('Todos')">Todos</button>
            <button class="cat-btn" onclick="filtrar('Programação')">Programação</button>
            <button class="cat-btn" onclick="filtrar('Marketing')">Marketing</button>
            <button class="cat-btn" onclick="filtrar('Design')">Design</button>
            <button class="cat-btn" onclick="filtrar('Negócios')">Negócios</button>
        </div>

        <div id="status" class="loading">Buscando servidores seguros...</div>
        <div id="grupos-container" class="grid-grupos"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://fufgsmmejwvibqkglkbv.supabase.co";
        const SUPABASE_KEY = "sb_publishable_KUq3cj4qjnjXdv2FEDQ5Xw_z9to0B5P";
        let todosOsGrupos = [];

        async function carregarGrupos() {
            try {
                const url = SUPABASE_URL + "/rest/v1/lista_grupos?aprovado=eq.true&select=*";
                const response = await fetch(url, {
                    method: 'GET',
                    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
                });
                todosOsGrupos = await response.json();
                renderizar(todosOsGrupos);
            } catch (error) {
                document.getElementById('status').innerText = "Erro ao conectar com a rede.";
            }
        }

        function renderizar(lista) {
            const container = document.getElementById('grupos-container');
            const statusNode = document.getElementById('status');
            container.innerHTML = '';
            
            if (lista.length === 0) {
                statusNode.innerText = "Nenhum canal verificado nesta categoria.";
                statusNode.style.display = 'block';
                return;
            }
            statusNode.style.display = 'none';

            lista.forEach(grupo => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <h3>${grupo.nome}</h3>
                        <span class="badge">${grupo.categoria}</span>
                    </div>
                    <p>${grupo.descricao || 'Grupo premium verificado pelos administradores.'}</p>
                    <div class="card-footer">
                        <div class="like-zone">
                            <button class="btn-like" onclick="darLike(${grupo.id}, ${grupo.likes || 0})">🔥</button>
                            <span class="like-count" id="like-count-${grupo.id}">${grupo.likes || 0}</span>
                        </div>
                        <a href="${grupo.link}" target="_blank" class="btn-entrar">ENTRAR</a>
                    </div>
                ;
                container.appendChild(card);
            });
        }

        function filtrar(categoria) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            if (categoria === 'Todos') {
                renderizar(todosOsGrupos);
            } else {
                const filtrados = todosOsGrupos.filter(g => g.categoria === categoria);
                renderizar(filtrados);
            }
        }

        async function darLike(id, likesAtuais) {
            const novoLike = likesAtuais + 1;
            document.getElementById(like-count-${id}`).innerText = novoLike;
            
            await fetch(SUPABASE_URL + "/rest/v1/lista_grupos?id=eq." + id, {
                method: 'PATCH',
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ likes: novoLike })
            });
        }

        carregarGrupos();
    </script>
</body>
</html>
