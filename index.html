<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TELEGROUPS</title>
    <style>
        :root {
            --bg-principal: #04060a;
            --bg-card: #0a0f1d;
            --verde-neon: #00ff87;
            --azul-telegram: #0088cc;
            --texto-p: #798a9e;
            --texto-h: #ffffff;
            --borda: #141f36;
            --alerta-18: #ff3344;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: '-apple-system', BlinkMacSystemFont, sans-serif; }
        body { background: var(--bg-principal); color: var(--texto-h); padding: 15px 0; overflow-x: hidden; }
        
        .container { max-width: 500px; margin: 0 auto; padding: 0 15px; opacity: 1; }
        body.com-loading .container { opacity: 0; animation: fadeInSite 0.5s 1.6s forwards; }

        /* TELA DE CARREGAMENTO HACKER EM PORTUGUÊS */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #04060a; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }
        .cyber-loader {
            width: 60px; height: 60px; border: 3px solid transparent;
            border-top-color: var(--verde-neon); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 20px;
        }
        .loading-text {
            color: var(--verde-neon); font-size: 11px; font-weight: 800;
            letter-spacing: 3px; font-family: monospace; text-transform: uppercase;
            animation: pulse 1s infinite alternate;
            text-align: center; padding: 0 20px;
        }

        /* LOGO ESTILO STRATTON OAKMONT ROTACIONANDO */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--borda); margin-bottom: 15px; }
        .stratton-logo { display: flex; align-items: center; gap: 12px; }
        
        .circle-laurel {
            width: 45px; height: 45px;
            border: 3px dashed var(--verde-neon);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 15px rgba(0, 255, 135, 0.2);
            animation: rotateSlow 20s linear infinite;
        }
        .circle-inner { width: 29px; height: 29px; border: 1px solid var(--verde-neon); border-radius: 50%; }
        
        .logo-text { font-size: 22px; font-weight: 900; letter-spacing: 1px; color: var(--texto-h); }

        .btn-enviar { 
            background: transparent; color: var(--verde-neon); border: 1px solid var(--verde-neon);
            padding: 6px 14px; text-decoration: none; border-radius: 6px; font-weight: 800; 
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
        }

        /* BANNER DE ANÚNCIO FLUIDO */
        .banner-anuncio { background: linear-gradient(45deg, #101226, #0a0f1d); border: 1px dashed #1e293b; border-radius: 10px; padding: 12px; text-align: center; margin-bottom: 15px; color: var(--texto-p); font-size: 12px; font-weight: 600; }
        .banner-anuncio span { color: var(--verde-neon); }

        /* NAVEGAÇÃO HORIZONTAL EM LINHA RETA (SLIDER DE CATEGORIAS) */
        .categorias-container { 
            margin-bottom: 20px; 
            width: 100%;
            overflow-x: auto; 
            white-space: nowrap;
            padding: 5px 15px;
            margin-left: -15px;
            width: calc(100% + 30px);
            -webkit-overflow-scrolling: touch;
        }
        .categorias-container::-webkit-scrollbar { display: none; }
        
        .categorias-nav { display: inline-flex; gap: 8px; }
        
        .cat-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-card); border: 1px solid var(--borda); color: var(--texto-h); 
            padding: 10px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; 
            font-weight: 700; transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .cat-btn .count-badge { background: rgba(255,255,255,0.08); color: var(--texto-p); padding: 1px 6px; border-radius: 6px; font-size: 10px; margin-left: 4px; }
        
        .cat-btn.active { border-color: var(--verde-neon); background: rgba(0,255,135,0.06); color: var(--verde-neon); }
        .cat-btn.active .count-badge { background: var(--verde-neon); color: var(--bg-principal); font-weight: 800; }
        
        .cat-btn[data-cat="+18"] { border-right: 2px solid var(--alerta-18); }
        .cat-btn[data-cat="+18"].active { border-color: var(--alerta-18); background: rgba(255,51,68,0.06); color: var(--alerta-18); }
        .cat-btn[data-cat="+18"].active .count-badge { background: var(--alerta-18); color: white; }

        /* MARKETPLACE DE GRUPOS */
        .grid-grupos { display: flex; flex-direction: column; gap: 16px; }
        .card { background: var(--bg-card); border: 1px solid var(--borda); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        
        .card-banner { height: 110px; background-size: cover; background-position: center; position: relative; filter: brightness(0.85); }
        .card-banner::after { content: ''; position: absolute; width: 100%; height: 100%; background: linear-gradient(to bottom, transparent 30%, var(--bg-card)); }

        .card-corpo { padding: 16px; position: relative; margin-top: -20px; z-index: 2; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 10px; }
        .card h3 { font-size: 18px; font-weight: 800; color: #fff; line-height: 1.2; }
        
        .selo-verificado { color: var(--verde-neon); font-size: 11px; font-weight: 800; padding: 3px 6px; background: rgba(0,255,135,0.05); border: 1px solid var(--verde-neon); border-radius: 6px; text-shadow: 0 0 5px var(--verde-neon); display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0; }
        .badge { background: rgba(255,255,255,0.05); color: var(--texto-p); font-size: 10px; padding: 3px 8px; border-radius: 5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .card p { color: var(--texto-p); font-size: 13.5px; line-height: 1.4; margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.02); padding-top: 12px; }
        .btn-entrar { background: var(--azul-telegram); color: white; padding: 10px 24px; text-decoration: none; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; border: none; transition: background 0.2s; }
        
        /* ESTILOS DA ÁREA DE LIKE ALTERNÁVEL */
        .like-zone { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.02); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--borda); transition: all 0.2s; }
        .like-zone.liked { border-color: #ff9900; background: rgba(255,153,0,0.05); }
        .btn-like { background: none; border: none; cursor: pointer; font-size: 14px; filter: grayscale(1); transition: filter 0.2s; }
        .like-zone.liked .btn-like { filter: grayscale(0); }
        .like-count { color: white; font-weight: 700; font-size: 12px; }

        .loading { text-align: center; color: var(--texto-p); padding: 40px; font-size: 13px; font-weight: 600; }

        /* ANIMAÇÕES */
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes rotateSlow { to { transform: rotate(360deg); } }
        @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }
        @keyframes fadeInSite { to { opacity: 1; } }
    </style>
</head>
<body>

    <!-- TELA DE CARREGAMENTO SEGURO -->
    <div id="loading-screen" style="display: none;">
        <div class="cyber-loader"></div>
        <div class="loading-text">ESTABELECENDO PROTOCOLO DE SEGURANÇA...</div>
    </div>

    <div class="container" id="main-container">
        <!-- HEADER COM LOGO DA STRATTON ATIVA -->
        <div class="header">
            <div class="stratton-logo">
                <div class="circle-laurel">
                    <div class="circle-inner"></div>
                </div>
                <div class="logo-text">TELEGROUPS</div>
            </div>
            <a href="enviar.html" class="btn-enviar">+ DIVULGAR</a>
        </div>

        <!-- VITRINE DE ANÚNCIOS -->
        <div class="banner-anuncio">
            SISTEMA DE TRÁFEGO PRIVADO. ANUNCIE: <span>t.me/seu_suporte</span>
        </div>

        <!-- FILTROS EM LINHA RETA HORIZONTAL DESLIZÁVEL -->
        <div class="categorias-container">
            <div class="categorias-nav">
                <button class="cat-btn active" onclick="filtrar('Todos')">⚡ Todos os Grupos <span class="count-badge" id="count-Todos">0</span></button>
                <button class="cat-btn" data-cat="Programação" onclick="filtrar('Programação')">🖥️ Programação <span class="count-badge" id="count-Programação">0</span></button>
                <button class="cat-btn" data-cat="Marketing" onclick="filtrar('Marketing')">📈 Marketing <span class="count-badge" id="count-Marketing">0</span></button>
                <button class="cat-btn" data-cat="Design" onclick="filtrar('Design')">🎨 Design <span class="count-badge" id="count-Design">0</span></button>
                <button class="cat-btn" data-cat="Negócios" onclick="filtrar('Negócios')">💼 Negócios <span class="count-badge" id="count-Negócios">0</span></button>
                <button class="cat-btn" data-cat="Amizades" onclick="filtrar('Amizades')">💬 Amizades <span class="count-badge" id="count-Amizades">0</span></button>
                <button class="cat-btn" data-cat="Apostas" onclick="filtrar('Apostas')">🎲 Apostas <span class="count-badge" id="count-Apostas">0</span></button>
                <button class="cat-btn" data-cat="+18" onclick="filtrar('+18')">🔞 +18 <span class="count-badge" id="count-+18">0</span></button>
            </div>
        </div>

        <div id="status" class="loading">Carregando vitrine...</div>
        <div id="grupos-container" class="grid-grupos"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://fufgsmmejwvibqkglkbv.supabase.co";
        const SUPABASE_KEY = "sb_publishable_KUq3cj4qjnjXdv2FEDQ5Xw_z9to0B5P";
        let todosOsGrupos = [];
        let categoriaAtual = 'Todos';

        // SISTEMA DE MEMÓRIA DA SESSÃO
        const screen = document.getElementById('loading-screen');
        if (!sessionStorage.getItem('primeiroAcessoConcluido')) {
            document.body.classList.add('com-loading');
            screen.style.display = 'flex';
            
            window.addEventListener('load', () => {
                setTimeout(() => {
                    screen.style.display = 'none';
                    sessionStorage.setItem('primeiroAcessoConcluido', 'true');
                }, 1500);
            });

            setTimeout(() => {
                if(screen.style.display !== 'none') {
                    screen.style.display = 'none';
                    sessionStorage.setItem('primeiroAcessoConcluido', 'true');
                }
            }, 2000);
        }

        const bannersCategoria = {
            "Programação": "https://images.unsplash.com/photo-1607799279861-4dd421887fb3?w=500&q=60",
            "Marketing": "https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=500&q=60",
            "Design": "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&q=60",
            "Negócios": "https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=500&q=60",
            "Amizades": "https://images.unsplash.com/photo-1511632765486-a01980e01a18?w=500&q=60",
            "Apostas": "https://images.unsplash.com/photo-1596838132731-3301c3fd4317?w=500&q=60",
            "+18": "https://cdn.pixabay.com/photo/2021/01/29/14/41/woman-5961222_640.jpg",
            "Padrão": "https://images.unsplash.com/photo-1614741118887-7a4ee193a5fa?w=500&q=60"
        };

        async function carregarGrupos() {
            try {
                const url = SUPABASE_URL + "/rest/v1/lista_grupos?aprovado=eq.true&select=*";
                const response = await fetch(url, {
                    method: 'GET',
                    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
                });
                todosOsGrupos = await response.json();
                
                calcularContadores();
                filtrar(categoriaAtual);
            } catch (error) {
                document.getElementById('status').innerText = "Erro na conexão.";
            }
        }

        function calcularContadores() {
            document.getElementById('count-Todos').innerText = todosOsGrupos.length;
            const cats = ['Programação', 'Marketing', 'Design', 'Negócios', 'Amizades', 'Apostas', '+18'];
            cats.forEach(c => {
                const qtd = todosOsGrupos.filter(g => g.categoria === c).length;
                document.getElementById('count-' + c).innerText = qtd;
            });
        }

        function renderizar(lista) {
            const container = document.getElementById('grupos-container');
            const statusNode = document.getElementById('status');
            container.innerHTML = '';
            
            if (!lista || lista.length === 0) {
                statusNode.innerText = "Nenhum canal ativo nesta categoria.";
                statusNode.style.display = 'block';
                return;
            }
            statusNode.style.display = 'none';

            const curtidos = JSON.parse(localStorage.getItem('grupos_curtidos')) || [];

            lista.forEach(grupo => {
                const urlBanner = bannersCategoria[grupo.categoria] || bannersCategoria["Padrão"];
                
                const eVerificado = grupo.descricao && grupo.descricao.includes("[VIP]") ? '<span class="selo-verificado">⚡ VIP</span>' : '';
                const descricaoLimpa = grupo.descricao ? grupo.descricao.replace("[VIP]", "") : 'Link ativo para transferência.';
                
                const jaCurtiu = curtidos.includes(grupo.id);
                const classeLiked = jaCurtiu ? 'liked' : '';
                
                let contagemLikes = grupo.likes === null || grupo.likes === undefined ? 0 : grupo.likes;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-banner" style="background-image: url('${urlBanner}')"></div>
                    <div class="card-corpo">
                        <div class="card-header">
                            <h3>${grupo.nome}</h3>
                            <span class="badge">${grupo.categoria}</span>
                        </div>
                        <p>${descricaoLimpa}</p>
                        <div class="card-footer">
                            <div class="like-zone ${classeLiked}" id="like-zone-${grupo.id}">
                                <button class="btn-like" onclick="gerenciarLike(event, ${grupo.id})">🔥</button>
                                <span class="like-count" id="like-count-${grupo.id}">${contagemLikes}</span>
                            </div>
                            ${eVerificado}
                            <button class="btn-entrar" onclick="registrarClique(${grupo.id}, '${grupo.link}', ${grupo.cliques || 0})">ACESSAR</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filtrar(categoria) {
            categoriaAtual = categoria;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('active');
                if(b.getAttribute('data-cat') === categoria || (categoria === 'Todos' && b.innerText.includes('Todos'))) {
                    b.classList.add('active');
                }
            });

            if (categoria === 'Todos') {
                renderizar(todosOsGrupos);
            } else {
                const filtrados = todosOsGrupos.filter(g => g.categoria === categoria);
                renderizar(filtrados);
            }
        }

        async function gerenciarLike(event, id) {
            if(event) event.stopPropagation();
            
            let curtidos = JSON.parse(localStorage.getItem('grupos_curtidos')) || [];
            const index = curtidos.indexOf(id);
            
            const grupoLocal = todosOsGrupos.find(g => g.id === id);
            if (!grupoLocal) return;

            if(grupoLocal.likes === null || grupoLocal.likes === undefined) {
                grupoLocal.likes = 0;
            }

            let likesAtuais = grupoLocal.likes;
            let novoLike;

            if (index === -1) {
                novoLike = likesAtuais + 1;
                curtidos.push(id);
            } else {
                novoLike = Math.max(0, likesAtuais - 1);
                curtidos.splice(index, 1);
            }

            grupoLocal.likes = novoLike;
            localStorage.setItem('grupos_curtidos', JSON.stringify(curtidos));
            
            const elementoContador = document.getElementById(`like-count-${id}`);
            const elementoZona = document.getElementById(`like-zone-${id}`);
            if(elementoContador) elementoContador.innerText = novoLike;
            if(elementoZona) {
                if (index === -1) elementoZona.classList.add('liked');
                else elementoZona.classList.remove('liked');
            }

            try {
                await fetch(SUPABASE_URL + "/rest/v1/lista_grupos?id=eq." + id, {
                    method: 'PATCH',
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": "Bearer " + SUPABASE_KEY,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ likes: novoLike })
                });
            } catch(e) {
                console.error("Erro ao sincronizar curtida com o banco de dados.");
            }
        }

        async function registrarClique(id, linkOriginal, cliquesAtuais) {
            const novosCliques = cliquesAtuais + 1;
            window.open(linkOriginal, '_blank');

            const grupoLocal = todosOsGrupos.find(g => g.id === id);
            if(grupoLocal) grupoLocal.cliques = novosCliques;

            try {
                await fetch(SUPABASE_URL + "/rest/v1/lista_grupos?id=eq." + id, {
                    method: 'PATCH',
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": "Bearer " + SUPABASE_KEY,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ cliques: novosCliques })
                });
            } catch(e) {}
        }

        carregarGrupos();
    </script>
</body>
</html>
